# Разметка МОМЕНТОВ — фаза Ф2 (`charter/12_ANALYTICS.md §6`: D0-воронка МОМЕНТОВ,
# связка со сторами). Реестр допустимых событий и полей — источник истины для
# AnalyticsSchema.kt (клиент строго отбрасывает всё необъявленное здесь).
#
# Правило 2 (`12_ANALYTICS.md §1`): содержание не измеряется никогда. Ни одно
# поле ниже не свободный текст — только идентификаторы каталога (не заголовки),
# перечисления и числа.
#
# О-260817-06: события отправляются только после явного отдельного согласия
# пользователя (не то же согласие/экран, что чек-ин самочувствия); до согласия —
# не отправляются вовсе (в MVP — не пишутся в локальную очередь вовсе).
#
# `completion_pct` в practice_finished — редакторская метрика о контенте
# (насколько практика "досмотрена"), не продуктовая: не участвует в расчёте
# активации/удержания, только в отчётах по контенту.
#
# Установка (app_installed) всегда анализируется в паре с первой практикой в
# тот же календарный день — это правило агрегации на стороне витрины
# (`analytics/metrics/*.sql`, владелец CDO), а не поле события.

events:
  app_installed:
    description: >
      Первый холодный старт приложения. Момент фиксируется локально всегда
      (installedAtEpochMs), но событие уходит в очередь только когда/если
      пользователь даёт согласие на аналитику — задним числом, с реальным
      временем установки.
    props: {}

  practice_started:
    description: Практика запущена (тап «Начать» в шите).
    props:
      practice_id: { type: string, description: "идентификатор практики каталога, не название" }
      group: { type: string, description: "PracticeGroup enum (SLEEP/EXIT_DAY/ANXIETY/TALKS/SUPPORT)" }
      is_sleep: { type: boolean }

  practice_finished:
    description: >
      Практика завершена (доиграла, или сонная дошла до угасания, или после
      практики нажали «Готово»/«Пропустить» в экране «После практики»).
    props:
      practice_id: { type: string }
      group: { type: string }
      is_sleep: { type: boolean }
      completion_pct: { type: integer, description: "0..100, редакторская метрика о контенте, не продуктовая" }

  crossed_to_product:
    description: >
      Переход в другой продукт СИМПАС (напр. ПРАКТИКА) из МОМЕНТОВ.
      На 17.08.2026 в приложении нет ни одной такой точки перехода (нет
      кросс-промо UI) — событие и схема готовы, вызова нет нигде в коде.
      Добавление точки перехода — отдельное продуктовое решение, не входит
      в разметку.
    props:
      target_product: { type: string, description: "напр. \"practice\"" }
