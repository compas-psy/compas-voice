name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          /tmp/gradle-8.9/bin/gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ../android-tests.log

      # Гейт только для сборки, результат которой реально уходит к людям
      # (main → см. `if` на шаге Create Release ниже, то же условие). Ветки
      # и PR собираются и без секрета — контрибьютору он не нужен, чтобы
      # видеть, что код компилируется и тесты зелёные. Локальную сборку
      # разработчика (`./gradlew assembleDebug` на своей машине) этот
      # workflow вообще не запускает — её эта проверка не касается никак,
      # это отдельный процесс на отдельной машине без доступа к секретам CI.
      #
      # Зачем так строго: без ANALYTICS_INGEST_SECRET_MOMENTS приёмник
      # аналитики (verifyIngestSecret) — fail-closed, отвечает 401 на КАЖДОЕ
      # событие МОМЕНТОВ. Собранное приложение при этом не падает и не
      # жалуется — транспорт просто молча логирует и не пытается слать (см.
      # `AppContainer.kt`, `analyticsTransportConfigured`). Итог без этой
      # проверки: APK уходит к людям немым, а обнаруживается это не сейчас, а
      # через месяц по пустой аналитической панели. Упасть здесь, за 10 секунд
      # и с понятным сообщением, дешевле.
      - name: Проверка секрета аналитики перед релизом
        if: github.ref == 'refs/heads/main'
        env:
          ANALYTICS_INGEST_SECRET_MOMENTS: ${{ secrets.ANALYTICS_INGEST_SECRET_MOMENTS }}
        shell: bash
        run: |
          if [ -z "$ANALYTICS_INGEST_SECRET_MOMENTS" ]; then
            echo "::error::ANALYTICS_INGEST_SECRET_MOMENTS не задан — релизная сборка МОМЕНТОВ остановлена."
            cat <<'MSG'

          ЧТО НЕ ЗАДАНО
          Секрет ANALYTICS_INGEST_SECRET_MOMENTS пуст. Эта сборка уходит в
          GitHub Release реальным людям, а без секрета приёмник аналитики
          отвечает 401 на каждое событие МОМЕНТОВ — приложение уедет молчащим,
          и это обнаружится не сейчас, а через месяц по пустой панели.

          ГДЕ ЗАВЕСТИ
          Репозиторий compas-psy/compas-voice на GitHub → Settings →
          Secrets and variables → Actions → New repository secret.
          Имя секрета:  ANALYTICS_INGEST_SECRET_MOMENTS

          ЧТО В НЕГО ПОЛОЖИТЬ
          Это СОБСТВЕННЫЙ секрет МОМЕНТОВ, отдельный от секретов ПРАКТИКИ и
          ЗАПИСОК. Значение — то, которое приёмник знает как ingest-секрет
          продукта moments (заводит владелец приёмника). Секреты обязаны
          совпадать побайтово — иначе приёмник так же ответит 401, только
          сборка при этом молча пройдёт (значение будет непустым, но неверным),
          и эта проверка такую ошибку не ловит: сверьте значение вручную.

          Локальную (debug) сборку на своей машине это не касается —
          разработчику секрет для компиляции и тестов не нужен.

          MSG
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android
        shell: bash
        env:
          # Собственный секрет приёмника для МОМЕНТОВ (О-260817-17). Пустая
          # строка для сборок, не прошедших гейт выше (PR/ветки без секрета в
          # CI) — приложение тогда просто не пытается слать, см. AppContainer.kt.
          # Значение ЗАШИВАЕТСЯ В APK как есть — оно достаётся из любого
          # скачанного файла (см. честный комментарий в app/build.gradle.kts
          # рядом с buildConfigField); именно поэтому секрет свой у МОМЕНТОВ —
          # его утечка ограничивает ущерб отправкой только событий moments.
          ANALYTICS_INGEST_SECRET_MOMENTS: ${{ secrets.ANALYTICS_INGEST_SECRET_MOMENTS }}
        run: |
          set -o pipefail
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace \
            -PanalyticsIngestUrl=https://cmpas.ru/api/ingest \
            -PanalyticsIngestSecretMoments="$ANALYTICS_INGEST_SECRET_MOMENTS" \
            2>&1 | tee ../android-build.log

      # Лог грузим ТОЛЬКО при падении сборки (тогда он и нужен) и best-effort:
      # переполнение квоты артефактов не должно блокировать выпуск релиза.
      - name: Upload build log (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 3

      - name: Prepare APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSION=$(grep 'versionName' android/app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          FILENAME="kompas-voice-${VERSION}-${SHA}.apk"
          cp "$APK_PATH" "$FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # APK доставляется через Release (хранилище релизов отдельное от квоты
      # артефактов Actions). Отдельную выгрузку APK-артефакта убрали — она
      # дублировала релиз и съедала квоту.
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: "МОМЕНТЫ · голосовые практики ${{ steps.apk.outputs.version }} (#${{ github.run_number }})"
          body: |
            ## МОМЕНТЫ — голосовые практики (Android)
            Debug-сборка. Скачайте APK ниже и установите на телефон.
          files: kompas-voice-*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
