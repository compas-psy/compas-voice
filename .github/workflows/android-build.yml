name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Продукт СИМПАС для этого репозитория. Ровно одно из: praktika, zapiski, momenty.
  PRODUCT: momenty

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      # ── Имя артефакта и тег релиза (правило именования СИМПАС) ────────────
      # Правило зафиксировано в CLAUDE.md. Здесь оно ЗАСТРАХОВАНО СБОРКОЙ:
      #   файл  simpas-<продукт>-<версия>.apk
      #   тег   <продукт>-v<версия>
      # Без хеша коммита и без номера прогона: человек видит имя в загрузках,
      # суффикс -a3f9c21 или -b27 ему ничего не сообщает. Релиз соответствует
      # ВЕРСИИ, не прогону. versionName берётся из build.gradle.kts.
      - name: Имя артефакта и тег (правило СИМПАС)
        id: naming
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')"
          [ -n "${version}" ] || { echo '::error::versionName не найден в build.gradle.kts'; exit 1; }

          apk_name="simpas-${PRODUCT}-${version}.apk"
          tag="${PRODUCT}-v${version}"

          # Каноничные шаблоны имени и тега. Никакого run_number, никакого sha.
          name_re="^simpas-(praktika|zapiski|momenty)-[0-9]+(\.[0-9]+)*\.apk$"
          tag_re="^(praktika|zapiski|momenty)-v[0-9]+(\.[0-9]+)*$"

          # check_name <строка> <регэксп> <человекочитаемое-что-проверяем> [quiet]
          # Печатает, ЧЕГО не хватает, и возвращает ненулевой код при несоответствии.
          # quiet (необязательный 4-й аргумент) — для самопроверки ниже: диагностика
          # остаётся в логе, но БЕЗ команды `::error::`. Без этого различия сама
          # проверка исправности сторожа (намеренно подсовывает заведомо неверное
          # имя и ждёт отказа) печатала бы `::error::` в stdout — а её GitHub Actions
          # разбирает как настоящую ошибку сборки и вешает аннотацию, даже когда шаг
          # и вся сборка зелёные. Глушить весь вывод (`>/dev/null`) было бы проще, но
          # тогда пропала бы диагностика на случай, если сам самотест сломается
          # по другой причине (например, опечатка в регэкспе).
          check_name() {
            local value="$1" re="$2" what="$3" quiet="${4:-}"
            if [[ "${value}" =~ ${re} ]]; then
              return 0
            fi
            if [ -n "${quiet}" ]; then
              echo "${what} '${value}' не соответствует правилу именования СИМПАС (${re})."
            else
              echo "::error::${what} '${value}' не соответствует правилу именования СИМПАС (${re})."
            fi
            case "${value}" in
              *b[0-9]*|*run*)     echo "  → похоже на номер прогона (bNN) в имени — уберите, релиз привязан к версии, а не к сборке." ;;
            esac
            if [[ "${value}" =~ [0-9a-f]{7,40} ]] && [[ ! "${value}" =~ ^simpas-|^(praktika|zapiski|momenty)-v ]]; then
              echo "  → похоже на хеш коммита в имени — уберите, человеку он ничего не сообщает."
            fi
            case "${value}" in
              kompas*|compas*|cmpas*) echo "  → продукт назван как kompas/compas/cmpas; в артефактах СИМПАС используется приставка simpas и код продукта praktika|zapiski|momenty." ;;
            esac
            return 1
          }

          # ТЕСТ СНАЧАЛА ДОЛЖЕН ПАДАТЬ: заведомо неверное имя обязано быть пойманным.
          # Прежнее имя kompas-voice-<ver>-<sha>.apk — ровно то, что правило запрещает.
          echo '── самопроверка сторожа на заведомо неверном имени ──'
          if check_name "kompas-voice-${version}-b27.apk" "${name_re}" "самопроверка" quiet; then
            echo "::error::Сторож именования пропустил заведомо неверное имя kompas-voice-${version}-b27.apk — проверка сломана."
            exit 1
          fi
          echo "  OK: неверное имя поймано."

          # Настоящие имя и тег обязаны пройти.
          check_name "${apk_name}" "${name_re}" "имя APK"
          check_name "${tag}" "${tag_re}" "тег релиза"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"          >> "$GITHUB_OUTPUT"
          echo "Артефакт: ${apk_name}   Тег: ${tag}   (постоянная ссылка: https://cmpas.ru/updates/latest/${PRODUCT}.apk)"

      - name: Unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          /tmp/gradle-8.9/bin/gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ../android-tests.log

      # Гейт секрета аналитики — только для сборки, которая уходит к людям (main).
      # Без ANALYTICS_INGEST_SECRET_MOMENTS приёмник (verifyIngestSecret) отвечает
      # 401 на каждое событие МОМЕНТОВ — приложение уедет немым, обнаружится это
      # через месяц по пустой панели. Упасть здесь дешевле.
      - name: Проверка секрета аналитики перед релизом
        if: github.ref == 'refs/heads/main'
        env:
          ANALYTICS_INGEST_SECRET_MOMENTS: ${{ secrets.ANALYTICS_INGEST_SECRET_MOMENTS }}
        shell: bash
        run: |
          if [ -z "$ANALYTICS_INGEST_SECRET_MOMENTS" ]; then
            echo "::error::ANALYTICS_INGEST_SECRET_MOMENTS не задан — релизная сборка МОМЕНТОВ остановлена."
            echo "Заведите секрет ANALYTICS_INGEST_SECRET_MOMENTS (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # release-сборка: minify + shrink, подпись рабочим ключом из репозитория
      # (android/keystore, signingConfigs в app/build.gradle.kts). Секретов CI для
      # подписи не требует — поэтому сюрпризы proguard и готовый подписанный пакет
      # проверяются одинаково и на PR, и на main. Отпечаток готового APK сверяется
      # ниже с android/app/EXPECTED_SIGNER.txt.
      - name: Build release APK
        working-directory: android
        shell: bash
        env:
          ANALYTICS_INGEST_SECRET_MOMENTS: ${{ secrets.ANALYTICS_INGEST_SECRET_MOMENTS }}
        run: |
          set -o pipefail
          /tmp/gradle-8.9/bin/gradle assembleRelease --no-daemon --stacktrace \
            -PanalyticsIngestUrl=https://cmpas.ru/api/ingest \
            -PanalyticsIngestSecretMoments="${ANALYTICS_INGEST_SECRET_MOMENTS:-}" \
            2>&1 | tee ../android-build.log

      - name: Locate built release APK
        id: builtapk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | sort | head -1)"
          [ -n "${apk}" ] || { echo '::error::release APK не найден после assembleRelease'; exit 1; }
          echo "path=${apk}" >> "$GITHUB_OUTPUT"
          echo "Собран: ${apk}"

      # ── Сторож ГОТОВОГО пакета: debuggable + разрешения ──────────────────
      # Проверяется распространяемый файл, а не шаблон манифеста: разрешение
      # может приехать из зависимости, которую никто не звал.
      - name: Guard — APK не debuggable
        shell: bash
        run: |
          set -euo pipefail
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name 'aapt2' -type f | sort -V | tail -1)"
          [ -n "${aapt}" ] || { echo '::error::aapt2 не найден'; exit 1; }
          badging="$("${aapt}" dump badging '${{ steps.builtapk.outputs.path }}')"
          if echo "${badging}" | grep -qi "application-debuggable"; then
            echo "::error::Собранный APK помечен debuggable — такой пакет НЕЛЬЗЯ раздавать людям (к нему подключается отладчик и читается память с секретами; Google Play его не принимает)."
            exit 1
          fi
          echo "OK: application-debuggable отсутствует."

      - name: Guard — разрешения APK против android-permissions.txt
        shell: bash
        run: |
          set -euo pipefail
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name 'aapt2' -type f | sort -V | tail -1)"
          allow_file="android/app/android-permissions.txt"

          # Разрешения из ГОТОВОГО APK.
          "${aapt}" dump permissions '${{ steps.builtapk.outputs.path }}' > /tmp/perm_dump.txt
          echo '── что напечатал aapt2 ──'; cat /tmp/perm_dump.txt
          apk_perms="$(grep -oP "uses-permission: name='\\K[^']+" /tmp/perm_dump.txt | sort -u || true)"

          # Разрешённые имена из файла + требование объяснения у каждого.
          # Строка-разрешение — без ведущего пробела и не начинается с '#'.
          allowed="$(grep -E '^[A-Za-z]' "${allow_file}" | awk '{print $1}' | sort -u || true)"

          # Каждое объявленное разрешение обязано иметь объяснение (строку с '#'
          # после него до следующего разрешения). Иначе — разрешение без причины.
          missing_reason="$(awk '
            /^[A-Za-z]/ { if (perm != "" && !explained) print perm; perm=$1; explained=0; next }
            /^[[:space:]]*#/ { if (perm != "") explained=1 }
            END { if (perm != "" && !explained) print perm }
          ' "${allow_file}")"
          if [ -n "${missing_reason}" ]; then
            echo "::error::В android-permissions.txt есть разрешение без объяснения:"; echo "${missing_reason}"
            exit 1
          fi

          # Незаявленное разрешение в APK — падение.
          undeclared="$(comm -23 <(echo "${apk_perms}") <(echo "${allowed}") | grep -v '^$' || true)"
          if [ -n "${undeclared}" ]; then
            echo "::error::В APK есть разрешение(я), не заявленные в ${allow_file}:"
            echo "${undeclared}"
            echo "  → либо уберите его из зависимости/манифеста, либо внесите в список с объяснением, зачем оно."
            exit 1
          fi

          # Заявлено, но в APK не попало — предупреждение (напр. maxSdkVersion).
          absent="$(comm -13 <(echo "${apk_perms}") <(echo "${allowed}") | grep -v '^$' || true)"
          [ -z "${absent}" ] || { echo "::warning::Заявлены, но в APK не видны (возможно maxSdkVersion): ${absent}"; }
          echo "OK: разрешения APK = { ${apk_perms} } — все заявлены и объяснены."

      # ── Сторож подписи ГОТОВОГО пакета ──────────────────────────────────
      # Проверяется распространяемый файл: тем ли ключом он подписан и не
      # отладочный ли это ключ. Секретов не требует (подпись делает Gradle
      # ключом из репозитория), поэтому идёт и на PR, и на main.
      - name: Guard — подпись APK совпадает с EXPECTED_SIGNER
        shell: bash
        run: |
          set -uo pipefail
          tools="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          apk='${{ steps.builtapk.outputs.path }}'
          "${tools}/apksigner" verify --verbose --print-certs "${apk}" > /tmp/apksigner.txt 2>&1
          code=$?
          cat /tmp/apksigner.txt
          if [ "${code}" -ne 0 ]; then
            echo "::error::apksigner verify не подтвердил подпись APK (код ${code}) — пакет не подписан или повреждён."
            exit 1
          fi

          expected="$(tr -d '[:space:]' < android/app/EXPECTED_SIGNER.txt)"
          got="$(grep -ioP 'certificate SHA-?256 digest:\s*\K[0-9a-f]+' /tmp/apksigner.txt | head -1 || true)"
          [ -n "${got}" ] || got="$(grep -ioP 'SHA-?256 digest:\s*\K[0-9a-f]+' /tmp/apksigner.txt | head -1 || true)"
          if [ "${got}" != "${expected}" ]; then
            echo "::error::Отпечаток подписи готового APK не совпал с android/app/EXPECTED_SIGNER.txt"
            echo "  apk:      ${got}"
            echo "  expected: ${expected}"
            echo "  → это ДРУГОЙ ключ. Смена ключа ломает обновление поверх установленных копий."
            exit 1
          fi

          # Пакет с CN=Android Debug — первое, на что реагирует Play Защита.
          if grep -qi 'CN=Android Debug' /tmp/apksigner.txt; then
            echo "::error::APK подписан отладочным ключом (CN=Android Debug) — раздавать нельзя."
            exit 1
          fi
          echo "OK: APK подписан ожидаемым ключом (${got}), CN не отладочный."

      # ── Публикация: имя по правилу СИМПАС, релиз на ВЕРСИЮ (обновляем на месте) ──
      - name: Публикация Release (по версии, обновление на месте)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp '${{ steps.builtapk.outputs.path }}' "artifacts/${{ steps.naming.outputs.apk_name }}"

          tag='${{ steps.naming.outputs.tag }}'
          title="МОМЕНТЫ v${{ steps.naming.outputs.version }} (Android)"
          notes=$'## МОМЕНТЫ — голосовые практики (Android)\nРелизная сборка (release, minify, подписана рабочим ключом).\nСкачайте APK ниже и установите на телефон.'

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Релиз ${tag} существует — обновляю файл и заметки на месте (та же версия)."
            gh release upload "${tag}" "artifacts/${{ steps.naming.outputs.apk_name }}" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" --prerelease
          else
            echo "Релиза ${tag} нет — создаю."
            gh release create "${tag}" "artifacts/${{ steps.naming.outputs.apk_name }}" \
              --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" --prerelease
          fi
          echo "Опубликовано: ${tag} / ${{ steps.naming.outputs.apk_name }}"

      - name: Upload build log (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 3
